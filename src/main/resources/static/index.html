<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hyunsu-delveloper</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>

<canvas id="background"></canvas>

<div class="center">
    <h1>안녕하세요</h1>

    <div class="login-card">
        <form id="loginForm" novalidate>
            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <input type="text" id="username" name="username" placeholder="아이디" autocomplete="username">
            </div>

            <div class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password">
            </div>

            <div class="row-end">
                <a href="/reset-password" class="link-muted">비밀번호 재설정</a>
            </div>

            <button type="submit" class="btn-primary">로그인</button>
        </form>

        <div class="divider">또는</div>

        <div class="social-row">
            <button type="button" class="btn-social" data-provider="google">
                <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 11v2.8h6.5c-.3 1.6-1.9 4.7-6.5 4.7-3.9 0-7.1-3.2-7.1-7.2s3.2-7.2 7.1-7.2c2.2 0 3.7.9 4.6 1.8l3.1-3C17.6 1 15 0 12 0 5.4 0 0 5.4 0 12s5.4 12 12 12c6.9 0 11.5-4.9 11.5-11.7 0-.8-.1-1.4-.2-2H12z"/></svg>
                Google
            </button>
        </div>

        <p class="signup-hint">계정이 없으신가요? <a href="/signup">회원가입</a></p>
    </div>
</div>
<script src="/js/common/modal.js"></script>
<script src="/js/common/common.js"></script>
<script src="/js/common/background.js"></script>
<script src="/js/auth/login.js"></script>
</body>
</html>
