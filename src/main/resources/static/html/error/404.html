<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyunsu-delveloper</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .error-code {
      font-size: clamp(56px, 10vw, 96px);
      font-weight: 700;
      color: #f5f3ff;
      letter-spacing: 0.04em;
      opacity: 0;
      animation: fadeUp 1.6s ease forwards;
      text-shadow: 0 0 32px rgba(168, 159, 207, 0.4);
    }

    .error-desc {
      margin-top: 10px;
      font-size: 14px;
      color: #9b91c4;
      opacity: 0;
      animation: fadeUp 1.6s ease 0.3s forwards;
    }

    .btn-home {
      margin-top: 32px;
      display: inline-block;
      padding: 12px 28px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b7fd1, #5d4fb8);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      opacity: 0;
      animation: fadeUp 1.6s ease 0.6s forwards;
    }
  </style>
</head>
<body>

<canvas id="background"></canvas>

<div class="center">
  <p class="error-code">404</p>
  <p class="error-desc">요청하신 페이지를 찾을 수 없습니다.</p>
  <a href="/" class="btn-home">홈으로 돌아가기</a>
</div>

<script src="/js/common/background.js"></script>
</body>
</html>
